name: debug
on: workflow_dispatch
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .yarn
            .yarnrc.yml
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: |
          node --version; uname -a; df -h /tmp "$RUNNER_TEMP"; ulimit -a | head -20
          mkdir -p /tmp/yt && cd /tmp/yt
          cp "$GITHUB_WORKSPACE/.yarn/releases/yarn-4.13.0.cjs" .
          sed 's#yarnPath: .yarn/releases/yarn-4.13.0.cjs#yarnPath: yarn-4.13.0.cjs#' "$GITHUB_WORKSPACE/.yarnrc.yml" > .yarnrc.yml
          printf '{"name":"yt","packageManager":"yarn@4.13.0","dependencies":{"zwitch":"2.0.4"}}' > package.json
          sudo apt-get install -y strace >/dev/null 2>&1 || true
          YARN_CACHE_FOLDER=/tmp/yt/cache strace -f -o /tmp/st.txt node yarn-4.13.0.cjs install || true
          grep -E "= -1 E" /tmp/st.txt | grep -v -E "ENOENT|EAGAIN|EEXIST|ENOTDIR|EINVAL|ESRCH|ECHILD|ENOTTY" | head -20
